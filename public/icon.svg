<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Glowing inner circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#grad)" stroke-width="6" stroke-dasharray="16 12" opacity="0.4"/>

  <!-- Center Backpack / Schedule emblem -->
  <g filter="url(#shadow)">
    <!-- Backpack Hull -->
    <rect x="156" y="160" width="200" height="230" rx="36" fill="url(#grad)"/>
    <!-- Top Grab Loop -->
    <path d="M 206 160 C 206 110, 306 110, 306 160" fill="none" stroke="url(#grad)" stroke-width="20" stroke-linecap="round"/>
    <!-- Front Pocket -->
    <rect x="186" y="260" width="140" height="105" rx="18" fill="#0f172a" opacity="0.9"/>
    <!-- Zipper accent -->
    <line x1="206" y1="285" x2="306" y2="285" stroke="#818cf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Checkmark Badge on Pocket -->
    <circle cx="256" cy="325" r="18" fill="#10b981"/>
    <path d="M 248 325 L 253 330 L 265 318" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
